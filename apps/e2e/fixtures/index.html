<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>neditor e2e harness</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #111;
      }
      #stage {
        max-width: 720px;
        margin: 16px auto;
      }
      .editor-host {
        min-height: 120px;
        border: 1px solid #ddd;
        padding: 8px 0;
      }
      .editor-host + .editor-host {
        margin-top: 24px;
      }
      .spacer {
        display: none;
        height: 1200px;
      }
      body.scrolling .spacer {
        display: block;
      }
      .outside {
        display: flex;
        gap: 12px;
        align-items: center;
        max-width: 720px;
        margin: 0 auto;
      }
      #foreign-source {
        padding: 8px 12px;
        border: 1px dashed #888;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="outside">
      <input id="before" aria-label="Before the editor" />
    </div>
    <div class="spacer" aria-hidden="true"></div>
    <main id="stage"></main>
    <div class="spacer" aria-hidden="true"></div>
    <div class="outside">
      <input id="after" aria-label="After the editor" />
      <div id="foreign-source" draggable="true">Foreign drag source</div>
      <textarea id="paste-target" aria-label="Paste target" rows="3" cols="30"></textarea>
    </div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
